<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        var widthFraction = 0.4;
        var heightFraction = 0.7;
        var maxW = 800;
        var maxH = 600;
        var minW = 380;
        var minH = 320;
        var w = Math.round(
          Math.min(maxW, Math.max(minW, screen.availWidth * widthFraction))
        );
        var h = Math.round(
          Math.min(maxH, Math.max(minH, screen.availHeight * heightFraction))
        );
        document.documentElement.style.width = w + "px";
        document.documentElement.style.height = h + "px";
      })();
    </script>
    <script src="app.js" defer></script>
    <title>Clipboard</title>
  </head>
  <body>
    <div class="app">
      <header class="head-info">
        <h2 class="title">Clipboard</h2>
      </header>

      <div class="input-area">
        <textarea
          id="clip"
          name="textarea"
          rows="3"
          placeholder="Paste or type something to save…"
        ></textarea>
        <div class="buttons">
          <button id="save-clip" type="button">Save</button>
          <button id="save-tab" type="button">Save Tab</button>
          <button id="clear-clip" type="button">Clear</button>
          <button id="delete-all" type="button" title="Double-click to delete all">
            Delete All
          </button>
        </div>
      </div>

      <div class="clips-container">
        <ul id="clips"></ul>
        <p class="empty-state" id="empty-state" hidden>No clips yet</p>
      </div>

      <div class="toast" id="toast" aria-live="polite"></div>
    </div>
  </body>
</html>
